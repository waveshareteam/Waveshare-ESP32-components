name: Component self check

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.check.outputs.components }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check component manifests
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BUILD_COMPONENT_SCOPE: auto
        run: python .github/scripts/component_self_check.py

  build-components:
    needs: manifest-check
    if: needs.manifest-check.outputs.count != '0'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${{ matrix.idf_version }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.manifest-check.outputs.components) }}
        idf_version:
          - v5.5.5
          - v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build component with ESP-IDF ${{ matrix.idf_version }}
        env:
          COMPONENT_DIR: ${{ matrix.component }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python .github/scripts/build_changed_component.py

  ci-gate:
    needs:
      - manifest-check
      - build-components
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          MANIFEST_RESULT: ${{ needs.manifest-check.result }}
          BUILD_RESULT: ${{ needs.build-components.result }}
          BUILD_COUNT: ${{ needs.manifest-check.outputs.count }}
        shell: bash
        run: |
          test "$MANIFEST_RESULT" = "success"
          if [ "$BUILD_COUNT" = "0" ]; then
            test "$BUILD_RESULT" = "skipped"
          else
            test "$BUILD_RESULT" = "success"
          fi
